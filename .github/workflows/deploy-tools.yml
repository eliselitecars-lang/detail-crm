# Tests of the deploy tooling (docs/DEPLOY.md 3.7): deploy_backend.sh end to
# end against a fake Supabase CLI and fake Management/Stripe APIs,
# verify_live.mjs against a fake project, the web header generator and the
# Pages-semantics static server. No secrets, no network: runs on every change
# to the tooling or to the files the tests read (config.toml verify_jwt,
# cron.sql placeholders, the migration list, function directories and env
# names, both webhooks' event lists and the Stripe API version, and web/src +
# web/index.html for the CSP's external origins).
name: deploy-tools

on:
  push:
    paths:
      - "scripts/deploy/**"
      - "supabase/config.toml"
      - "supabase/setup/cron.sql"
      - "supabase/migrations/*.sql"
      - "supabase/functions/*/index.ts"
      - "supabase/functions/_shared/env.ts"
      - "supabase/functions/_shared/stripe.ts"
      - "supabase/functions/stripe-webhook/handlers.ts"
      - "supabase/functions/billing-webhook/handlers.ts"
      - "web/index.html"
      - "web/src/**"
      - ".github/workflows/deploy-tools.yml"
  pull_request:
    paths:
      - "scripts/deploy/**"
      - "supabase/config.toml"
      - "supabase/setup/cron.sql"
      - "supabase/migrations/*.sql"
      - "supabase/functions/*/index.ts"
      - "supabase/functions/_shared/env.ts"
      - "supabase/functions/_shared/stripe.ts"
      - "supabase/functions/stripe-webhook/handlers.ts"
      - "supabase/functions/billing-webhook/handlers.ts"
      - "web/index.html"
      - "web/src/**"
      - ".github/workflows/deploy-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node --test scripts/deploy/test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy tooling tests (fake CLI + fake APIs)
        run: node --test "scripts/deploy/test/*.test.mjs"
