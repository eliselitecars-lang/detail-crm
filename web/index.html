<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Detail CRM</title>
    <script>
      // Apply the saved/system theme before first paint (no flash). Mirrors
      // src/app/ThemeProvider.tsx — keep the storage key in sync. A page
      // embedded in a shop's website (?embed=1 on /book/*, /lead/*) is light
      // unless the snippet asked for &theme=dark or auto (src/app/embedTheme.ts).
      (function () {
        try {
          var q = new URLSearchParams(window.location.search);
          if (
            q.get('embed') === '1' &&
            /^\/(book|lead)\/[^/]+\/?$/.test(window.location.pathname)
          ) {
            var t = q.get('theme');
            var embedDark =
              t === 'dark' ||
              (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = embedDark ? 'dark' : 'light';
            return;
          }
          var pref = localStorage.getItem('detailcrm:theme');
          var dark =
            pref === 'dark' ||
            ((pref === null || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
