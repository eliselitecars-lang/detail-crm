# Supabase CLI configuration for Detail CRM (`supabase start`, `supabase db`,
# `supabase functions serve/deploy`). Hosted project settings (auth URLs,
# SMTP, etc.) are managed in the Dashboard; this file drives local dev and the
# per-function deploy settings below. Every non-default choice is explained.

project_id = "detail-crm"

[api]
enabled = true
port = 54321
# Only `public` is exposed through PostgREST; tenant isolation is RLS on
# every table plus curated SECURITY DEFINER RPCs (SPEC section 3).
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Hard cap on rows per request; lists paginate.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Hosted Supabase provisions Postgres 17 for new projects and the CLI can
# only run 15 or 17 locally. The SQL suite (scripts/test_db.sh) runs on 16 and
# migrations avoid version-specific features, so 15+ all work (SPEC section 1).
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
# No seed file: shops seed their own defaults via AFTER INSERT triggers, and
# we never ship fake business data (CLAUDE.md non-negotiables).
enabled = false

[realtime]
enabled = true

[studio]
# Dashboard UI for local dev. scripts/stack/up.sh excludes it (and
# postgres-meta, imgproxy, vector, logflare, supavisor) to save disk/RAM.
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
# Local email catcher (mailpit; formerly [inbucket]) for auth emails
# (password resets, invites, email changes). UI: http://127.0.0.1:54324
enabled = true
port = 54324

[storage]
enabled = true
# Buckets (job-photos, signatures, shop-assets) and their policies are
# created by migrations so local and hosted match exactly.
file_size_limit = "50MiB"

[storage.image_transformation]
# Not used by the app (thumbnails are sized client-side); off so the local
# stack does not need the imgproxy container.
enabled = false

[auth]
enabled = true
# Local web app origin (Vite dev server, web/vite.config.ts; the real-stack
# harness scripts/stack/ serves it on 127.0.0.1). Hosted: set Site URL to
# APP_BASE_URL in the Dashboard.
site_url = "http://127.0.0.1:5173"
# Every web route GoTrue may redirect back to (email links / OAuth):
# /reset-password (recovery), /invite/:token (staff invites), /portal (client
# portal magic links), /app (staff), /login. Both local hostnames are listed
# because the browser treats localhost and 127.0.0.1 as different origins.
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/reset-password",
  "http://127.0.0.1:5173/invite/**",
  "http://127.0.0.1:5173/portal",
  "http://127.0.0.1:5173/app/**",
  "http://127.0.0.1:5173/login",
  "http://localhost:5173/reset-password",
  "http://localhost:5173/invite/**",
  "http://localhost:5173/portal",
  "http://localhost:5173/app/**",
  "http://localhost:5173/login",
]
# Access tokens live 1 h (Supabase default); refresh tokens rotate.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Clients act only through portal/public RPCs; anonymous auth users would be
# an unnecessary identity class (edge functions reject them too).
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
# LOCAL ONLY (hosted limits are set in the Dashboard): end-to-end suites sign
# up / sign in many users from one IP within minutes; the GoTrue default (30
# per 5 min) would make them flaky.
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
# Local: sign-ups are confirmed immediately (GoTrue "autoconfirm" still sets
# email_confirmed_at, so portal_claim_customers(), which links customers by
# CONFIRMED email, behaves as in production). Hosted projects keep
# confirmations ON (Dashboard -> Auth -> Email); mails are caught by mailpit
# locally (port 54324) if a flow sends one.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"

[auth.sms]
# Phone sign-in is not offered; Twilio is used only for customer messaging.
enable_signup = false

[edge_runtime]
enabled = true
# per_worker keeps module-level clients (adminClient, Stripe) warm between
# requests during local dev, like the hosted runtime.
policy = "per_worker"
inspector_port = 8083
# Functions are written for Deno 2 (SPEC section 1).
deno_version = 2

[analytics]
enabled = false

# ---------------------------------------------------------------------------
# Edge functions. All share supabase/functions/deno.json as their import map
# (one pinned dependency set; _shared/ is imported by relative path). Each
# function's verify_jwt choice is asserted by
# supabase/functions/_shared/config_test.ts.
# ---------------------------------------------------------------------------

# Staff-only (admin+): Connect onboarding links, status refresh, Express
# dashboard login links. Every caller has a Supabase session, so the gateway
# rejects anonymous calls before our code runs (defence in depth; the
# function still checks the role via requireShopRole).
[functions.stripe-connect]
verify_jwt = true
import_map = "./functions/deno.json"

# Mixed audience: invoice_checkout / booking_deposit_checkout are PUBLIC
# (authorized by an unguessable invoice/booking token), while payment_sheet,
# charge_saved_card, setup_card, refund and membership actions verify the
# caller's JWT and role inside the function. The gateway check must be off
# for the public actions to be reachable.
[functions.payments]
verify_jwt = false
import_map = "./functions/deno.json"

# Called by Stripe, which sends no Supabase JWT. Authenticity comes from the
# Stripe-Signature header (verifyStripeWebhook over the raw body).
[functions.stripe-webhook]
verify_jwt = false
import_map = "./functions/deno.json"

# Mixed audience: twilio_inbound / twilio_status are called by Twilio
# (X-Twilio-Signature verified), process_queue by pg_cron (x-cron-secret),
# and `send` by staff (JWT + role verified in the function).
[functions.messaging]
verify_jwt = false
import_map = "./functions/deno.json"

# Staff-only (admin+): emails invite links.
[functions.invites]
verify_jwt = true
import_map = "./functions/deno.json"

# pg_cron only (x-cron-secret): removes the stored files of deleted shops,
# jobs, inspections and forms queued by migration 0025 (Storage API, service
# role). No JWT is sent by pg_net.
[functions.storage-purge]
verify_jwt = false
import_map = "./functions/deno.json"
